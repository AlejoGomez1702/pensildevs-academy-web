<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400..700&display=block"
    />
    <style>
      :root {
        --brand: #4f46e5;
        --brand-deep: #3730a3;
        --brand-soft: #eef0ff;
        --ink: #16181d;
        --muted: #545a66;
        --paper: #ffffff;
        --bg: #f6f5fb;
        --green: #10b981;
        --pencil: #f6b81c;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        font-family: Inter, sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3,
      .display {
        font-family: 'Bricolage Grotesque', Inter, sans-serif;
        letter-spacing: -0.02em;
      }
      .scene {
        position: absolute;
        inset: 0;
        opacity: 0;
        will-change: opacity, transform;
      }
      .grid-bg {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(79, 70, 229, 0.07) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(79, 70, 229, 0.07) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at 50% 40%, black 30%, transparent 80%);
      }
      /* Intro and outro on brand indigo */
      .brand-scene {
        background: radial-gradient(circle at 30% 20%, #6366f1, var(--brand-deep) 70%);
        color: white;
      }
      .brand-scene .grid-bg {
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      }
      .center {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
      }
      .logo {
        width: 260px;
        filter: drop-shadow(0 24px 40px rgba(0, 0, 0, 0.35));
      }
      .hero-title {
        font-size: 150px;
        font-weight: 800;
        margin-top: 10px;
      }
      .hero-title .dot {
        color: var(--pencil);
      }
      .hero-sub {
        font-size: 46px;
        font-weight: 500;
        opacity: 0.9;
        margin-top: 18px;
        max-width: 1300px;
      }
      .eyebrow {
        font-size: 32px;
        font-weight: 700;
        color: var(--brand);
        display: inline-flex;
        gap: 14px;
        align-items: center;
      }
      .eyebrow::before {
        content: '';
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 6px rgba(16, 185, 129, 0.18);
      }
      .title {
        font-size: 76px;
        font-weight: 800;
        line-height: 1.04;
        margin-top: 18px;
      }
      .subtitle {
        font-size: 36px;
        color: var(--muted);
        margin-top: 26px;
        line-height: 1.35;
      }
      /* Chips */
      .chips-wrap {
        position: absolute;
        left: 160px;
        right: 160px;
        top: 170px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 22px;
        margin-top: 70px;
      }
      .chip {
        font-size: 38px;
        font-weight: 600;
        padding: 22px 38px;
        border-radius: 999px;
        background: white;
        border: 2px solid #e2e1f0;
        box-shadow: 0 10px 30px -18px rgba(22, 24, 29, 0.4);
      }
      .chip:nth-child(3n + 1) {
        border-color: var(--brand);
        color: var(--brand-deep);
      }
      .devices {
        display: flex;
        gap: 26px;
        margin-top: 70px;
        font-size: 32px;
        color: var(--muted);
        align-items: center;
      }
      .live {
        display: inline-flex;
        gap: 12px;
        align-items: center;
        color: #047857;
        font-weight: 700;
      }
      .live::before {
        content: '';
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--green);
      }
      /* Feature */
      .feature-text {
        position: absolute;
        left: 110px;
        top: 0;
        bottom: 0;
        width: 640px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .points {
        list-style: none;
        margin-top: 46px;
        display: grid;
        gap: 26px;
      }
      .points li {
        font-size: 33px;
        line-height: 1.3;
        display: flex;
        gap: 20px;
        align-items: flex-start;
      }
      .points li::before {
        content: '✓';
        flex: none;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: var(--brand);
        color: white;
        display: grid;
        place-items: center;
        font-size: 26px;
        font-weight: 800;
        margin-top: -2px;
      }
      .browser {
        position: absolute;
        left: 790px;
        top: 180px;
        width: 1070px;
        height: 723px;
        border-radius: 26px;
        background: white;
        box-shadow:
          0 50px 100px -40px rgba(55, 48, 163, 0.55),
          0 0 0 1px rgba(22, 24, 29, 0.06);
        overflow: hidden;
      }
      .browser-bar {
        height: 54px;
        background: #f1f0f7;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 22px;
      }
      .browser-bar i {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #d4d2e3;
      }
      .browser-bar span {
        margin-left: 18px;
        font-size: 20px;
        color: var(--muted);
        background: white;
        border-radius: 999px;
        padding: 6px 22px;
      }
      .shot {
        position: absolute;
        top: 54px;
        left: 0;
        width: 1070px;
        height: 669px;
        overflow: hidden;
      }
      .shot img {
        width: 1070px;
        height: 669px;
        display: block;
        transform-origin: 50% 50%;
      }
      .shot {
        background: white;
      }
      /* Cards */
      .cards-wrap {
        position: absolute;
        left: 160px;
        right: 160px;
        top: 140px;
      }
      .cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 34px;
        margin-top: 64px;
      }
      .card {
        background: white;
        border-radius: 30px;
        padding: 44px 48px;
        border: 2px solid #e8e7f3;
        box-shadow: 0 24px 50px -36px rgba(22, 24, 29, 0.5);
      }
      .card h3 {
        font-size: 46px;
        font-weight: 800;
        color: var(--brand-deep);
      }
      .card p {
        font-size: 32px;
        color: var(--muted);
        margin-top: 14px;
        line-height: 1.35;
      }
      /* Steps */
      .steps {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 30px;
        margin-top: 90px;
      }
      .step {
        background: white;
        border-radius: 30px;
        padding: 44px 36px;
        border: 2px solid #e8e7f3;
        text-align: left;
      }
      .step b {
        display: grid;
        place-items: center;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: var(--pencil);
        font-size: 44px;
        font-weight: 800;
      }
      .step h3 {
        font-size: 40px;
        margin-top: 30px;
        line-height: 1.1;
      }
      .step p {
        font-size: 28px;
        color: var(--muted);
        margin-top: 12px;
      }
      .url {
        display: inline-block;
        margin-top: 46px;
        font-size: 40px;
        font-weight: 700;
        padding: 20px 44px;
        border-radius: 999px;
        background: var(--brand);
        color: white;
      }
      .outro-links {
        margin-top: 56px;
        display: flex;
        gap: 26px;
        justify-content: center;
      }
      .outro-links span {
        font-size: 38px;
        font-weight: 700;
        padding: 20px 40px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        border: 2px solid rgba(255, 255, 255, 0.4);
      }
      .outro-links span.primary {
        background: var(--pencil);
        color: var(--ink);
        border-color: var(--pencil);
      }
      .progress {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 8px;
        background: var(--pencil);
      }
      .reveal {
        will-change: opacity, transform;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div class="progress" id="progress"></div>
    <script src="scenes.js"></script>
    <script>
      const stage = document.getElementById('stage');
      const esc = (text) => text.replace(/&/g, '&amp;').replace(/</g, '&lt;');

      function sceneHtml(scene) {
        switch (scene.kind) {
          case 'intro':
            return `<div class="grid-bg"></div><div class="center"><div>
              <img class="logo reveal" data-at="0.2" src="assets/pensilpos-logo.png" alt="">
              <h1 class="hero-title reveal" data-at="0.7">Pensil<span class="dot">.</span>Pos</h1>
              <p class="hero-sub reveal" data-at="1.4">${esc(scene.subtitle)}</p></div></div>`;
          case 'chips':
            return `<div class="grid-bg"></div><div class="chips-wrap">
              <p class="eyebrow reveal" data-at="0.2">${esc(scene.eyebrow)}</p>
              <h2 class="title reveal" data-at="0.4">${esc(scene.title)}</h2>
              <div class="chips">${scene.chips.map((chip, i) => `<span class="chip reveal" data-at="${(1 + i * 0.35).toFixed(2)}">${esc(chip)}</span>`).join('')}</div>
              <div class="devices reveal" data-at="5.2"><span>Navegador · App Android</span><span class="live">En vivo</span></div></div>`;
          case 'feature':
            return `<div class="grid-bg"></div><div class="feature-text">
              <p class="eyebrow reveal" data-at="0.2">${esc(scene.eyebrow)}</p>
              <h2 class="title reveal" data-at="0.4">${esc(scene.title)}</h2>
              <ul class="points">${scene.points.map((point, i) => `<li class="reveal" data-at="${(1.4 + i * 1.6).toFixed(2)}">${esc(point)}</li>`).join('')}</ul></div>
              <div class="browser reveal" data-at="0.3" data-from="right"><div class="browser-bar"><i></i><i></i><i></i><span>pensilpos.com</span></div>
              <div class="shot"><img class="kenburns" src="assets/${scene.image}.webp" alt=""></div></div>`;
          case 'cards':
            return `<div class="grid-bg"></div><div class="cards-wrap">
              <p class="eyebrow reveal" data-at="0.2">${esc(scene.eyebrow)}</p>
              <h2 class="title reveal" data-at="0.4">${esc(scene.title)}</h2>
              <div class="cards">${scene.cards.map(([title, text], i) => `<div class="card reveal" data-at="${(1.2 + i * 1.4).toFixed(2)}"><h3>${esc(title)}</h3><p>${esc(text)}</p></div>`).join('')}</div></div>`;
          case 'steps':
            return `<div class="grid-bg"></div><div class="cards-wrap" style="text-align:center">
              <p class="eyebrow reveal" data-at="0.2">${esc(scene.eyebrow)}</p>
              <h2 class="title reveal" data-at="0.4">${esc(scene.title)}</h2>
              <div class="steps">${scene.steps.map(([title, text], i) => `<div class="step reveal" data-at="${(1.4 + i * 1.6).toFixed(2)}"><b>${i + 1}</b><h3>${esc(title)}</h3><p>${esc(text)}</p></div>`).join('')}</div>
              <span class="url reveal" data-at="8.4">pensilpos.com</span></div>`;
          case 'outro':
            return `<div class="grid-bg"></div><div class="center"><div>
              <img class="logo reveal" data-at="0.2" src="assets/pensilpos-logo.png" alt="" style="width:180px">
              <h2 class="hero-title reveal" data-at="0.6" style="font-size:92px">${esc(scene.title)}</h2>
              <p class="hero-sub reveal" data-at="1.2">${esc(scene.subtitle)}</p>
              <div class="outro-links reveal" data-at="2"><span class="primary">pensilpos.com</span><span>Pensil.Devs Academy</span></div></div></div>`;
        }
      }

      for (const scene of SCENES) {
        const element = document.createElement('section');
        element.className =
          'scene' + (scene.kind === 'intro' || scene.kind === 'outro' ? ' brand-scene' : '');
        element.id = scene.id;
        element.innerHTML = sceneHtml(scene);
        stage.append(element);
      }

      const clamp = (value) => Math.min(1, Math.max(0, value));
      const ease = (x) => 1 - Math.pow(1 - x, 3);
      const FADE = 0.6;

      window.renderAt = (t) => {
        document.getElementById('progress').style.width = `${(t / DURATION) * 100}%`;
        for (const scene of SCENES) {
          const element = document.getElementById(scene.id);
          const local = t - scene.start;
          const length = scene.end - scene.start;
          const isLast = scene === SCENES[SCENES.length - 1];
          const fadeIn = scene.start === 0 ? 1 : clamp(local / FADE);
          const fadeOut = isLast ? 1 : clamp((length - local) / FADE);
          const visible = local >= 0 && local <= length;
          element.style.opacity = visible ? String(Math.min(fadeIn, fadeOut)) : '0';
          element.style.transform = `scale(${1 + 0.015 * clamp(local / length)})`;
          if (!visible) continue;
          for (const item of element.querySelectorAll('.reveal')) {
            const at = Number(item.dataset.at);
            const p = ease(clamp((local - at) / 0.7));
            const fromRight = item.dataset.from === 'right';
            item.style.opacity = String(p);
            item.style.transform = fromRight
              ? `translateX(${(1 - p) * 120}px)`
              : `translateY(${(1 - p) * 36}px)`;
          }
          const image = element.querySelector('.kenburns');
          if (image) {
            const p = clamp(local / length);
            const [x, y] = scene.focus;
            image.style.transformOrigin = `${x}% ${y}%`;
            image.style.transform = `scale(${1 + (scene.zoom - 1) * ease(p)})`;
          }
        }
      };

      window.ready = Promise.all([
        document.fonts.ready,
        ...[...document.images].map((image) => image.decode()),
      ]).then(() => true);
    </script>
  </body>
</html>
